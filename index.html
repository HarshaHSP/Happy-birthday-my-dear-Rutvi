<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffe3ec" />
  <title>Happy Birthday Rutvi 🎂💖</title>

  <!-- Free Google Fonts (the page still works with normal fonts if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body data-theme="blush">

  <!--
    You never need to edit this file.
    ✏️ All the words, questions, replies, photos and settings are at the top of script.js
  -->

  <!-- Soft background that changes with each chapter -->
  <div class="sky">
    <div class="sky-blush"></div>
    <div class="sky-peach"></div>
    <div class="sky-dusk"></div>
    <div class="sky-black"></div>
  </div>
  <div id="bokeh" aria-hidden="true"></div>
  <div class="bunting" aria-hidden="true"></div>
  <div id="drift" aria-hidden="true"></div>

  <!-- Music: mute + volume -->
  <div class="audio-bar">
    <button id="muteBtn" aria-label="Mute or unmute music">🔊</button>
    <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume" />
  </div>

  <!-- The storybook page -->
  <main id="stage">
    <div class="chapter-label" id="chapterLabel"></div>
    <div class="photo-slot" id="photoSlot"></div>
    <section class="card" id="card"></section>
  </main>

  <!-- The birthday film (filled by script.js) -->
  <div class="cinema" id="cinema"></div>

  <!-- Only appears if a phone refuses to start the song by itself -->
  <button class="tap-song" id="tapSong" hidden>🎵 Tap to play our song</button>

  <script src="script.js"></script>
</body>
</html>
